name: Build, push, and deploy

on:
  workflow_dispatch:
    inputs:
      environment:
        description: GitHub Environment to deploy (must match the OIDC trust policy)
        type: choice
        options:
          - development
          - production
        default: development

permissions:
  contents: read
  id-token: write

concurrency:
  group: deploy-${{ github.event.inputs.environment || 'development' }}
  cancel-in-progress: false

env:
  AWS_REGION: eu-west-1
  AWS_ACCOUNT_ID: "840432317209"
  ECR_REPOSITORY: finzla-dev-api
  ECS_CLUSTER: finzla-dev-cluster
  ECS_SERVICE: finzla-dev-api
  ECS_TASK_FAMILY: finzla-dev-api
  HEALTH_URL: http://finzla-dev-alb-1168961660.eu-west-1.elb.amazonaws.com/health

jobs:
  build-and-push:
    name: Build and push image
    if: ${{ github.event.inputs.environment == 'development' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    outputs:
      image: ${{ steps.meta.outputs.image }}
    steps:
      - uses: actions/checkout@v4
      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::840432317209:role/finzla-dev-github-ci
          aws-region: ${{ env.AWS_REGION }}
      - name: Login to Amazon ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2
      - name: Image metadata
        id: meta
        run: |
          image="${{ env.AWS_ACCOUNT_ID }}.dkr.ecr.${{ env.AWS_REGION }}.amazonaws.com/${{ env.ECR_REPOSITORY }}:${{ github.sha }}"
          echo "image=${image}" >> "${GITHUB_OUTPUT}"
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.image }}
          build-args: |
            APP_VERSION=${{ github.sha }}

  deploy-development:
    name: Deploy development
    if: ${{ github.event.inputs.environment == 'development' }}
    needs: build-and-push
    runs-on: ubuntu-latest
    environment: development
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::840432317209:role/finzla-dev-github-deploy
          aws-region: ${{ env.AWS_REGION }}
      - name: Deploy and health-check
        env:
          IMAGE: ${{ needs.build-and-push.outputs.image }}
        run: |
          chmod +x .github/scripts/ecs-deploy.sh
          .github/scripts/ecs-deploy.sh

  deploy-production:
    name: Deploy production
    if: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.environment == 'production' }}
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Production gate
        run: |
          echo "Production deploys require the GitHub Environment 'production' (required reviewers)."
          echo "Apply the prod Terraform stack and replace this job with ECR/ECS prod values before using it."
          echo "OIDC will only succeed for repo Healerkay/finzla-platform with sub environment:production."
          exit 1
